name: live QA sweep

# The browser QA scripts (scripts/qa-*.mjs) ran only by hand until 2026-11-01, when one sweep of all 60 against the live
# site found two that had gone stale on a correct site and a layer whose data OBIS had changed underneath it. This job
# runs them weekly against the live site (scripts/qa-sweep.mjs: a failure is run once more; failing twice is reported,
# passing the second time is flaky) and keeps one GitHub issue, labelled qa-sweep, in step with it: opened when a script
# fails twice, updated weekly, closed when none does. Scripts that need a downloaded source or credentials are listed as
# not run. On a pull request it runs two scripts and prints the report but does not touch issues.

on:
  schedule:
    - cron: '0 16 * * 1' # Mondays 12:00 EDT / 11:00 EST, after the 09:00 deploy
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/qa-sweep.yml
      - scripts/qa-sweep.mjs

permissions:
  contents: read

concurrency:
  group: qa-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      # the runner image's Chrome: most QA scripts launch puppeteer with no path of their own
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - name: Run this shard's QA scripts against the live site
        env:
          SHARD: ${{ matrix.shard }}
          ONLY: ${{ github.event_name == 'pull_request' && (matrix.shard == 0 && 'qa-readout,qa-mhw' || 'none') || '' }}
        run: |
          if [ "$ONLY" = none ]; then echo '{"results":[],"notRun":[]}' > "qa-sweep-$SHARD.json"; exit 0; fi
          if [ -n "$ONLY" ]; then
            node scripts/qa-sweep.mjs --only "$ONLY" --out "qa-sweep-$SHARD.json"
          else
            node scripts/qa-sweep.mjs --shard "$SHARD/4" --out "qa-sweep-$SHARD.json"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-sweep-${{ matrix.shard }}
          path: qa-sweep-${{ matrix.shard }}.json

  report:
    needs: sweep
    # also when a shard crashed (npm ci, Chrome, the runner): the report says how many shards wrote nothing, and fails
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # the issue step is skipped on pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # every shard crashed: no artifact at all, and the report says 4 wrote nothing
        with:
          pattern: qa-sweep-*
          merge-multiple: true
      - name: Write the report
        id: report
        run: |
          set +e
          shopt -s nullglob
          node scripts/qa-sweep.mjs --report --expect 4 qa-sweep-*.json > report.md
          code=$?
          set -e
          # 0 nothing failed twice, 10 something did or a shard wrote nothing (FAILED_EXIT); anything else is the report failing
          if [ "$code" -ne 0 ] && [ "$code" -ne 10 ]; then echo "::error::qa-sweep --report exited $code"; exit "$code"; fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 10 ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; else echo "failed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Open, update or close the qa-sweep issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ steps.report.outputs.failed }}
        run: |
          gh label create qa-sweep --force --color D93F0B --description 'A browser QA script failed twice against the live site (qa-sweep.yml)'
          n=$(gh issue list --label qa-sweep --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$FAILED" = true ]; then
            if [ -z "$n" ]; then
              gh issue create --title 'Live QA sweep: scripts failing' --label qa-sweep --body-file report.md
            else
              gh issue edit "$n" --body-file report.md
              gh issue comment "$n" --body "Sweep of $(date -u +%F): the description has this week's report."
            fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "Sweep of $(date -u +%F): nothing failed twice."
          fi
