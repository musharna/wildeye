name: CI

on:
  pull_request:
  push:
    # The default branch is main-wildeye. With [main] this workflow had never
    # run on a push: zero runs on the default branch since it was created.
    branches: [main-wildeye]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24.14.0, 26.x]
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      # Which files a fresh load fetches before the app is ready, plus exact
      # vendor bytes (scripts/load-budget-check.mjs). The file set does not
      # depend on the Node version, so one leg is enough. Chrome comes from the
      # runner image (PUPPETEER_SKIP_DOWNLOAD skips Puppeteer's own download).
      - name: Check startup weight
        if: matrix.node == '24.14.0'
        run: npm run perf:load

