name: CI

on:
  pull_request:
  push:
    # The default branch is main-wildeye. With [main] this workflow had never
    # run on a push: zero runs on the default branch since it was created.
    branches: [main-wildeye]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24.14.0, 26.x]
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --strict-allow-scripts fails the install when a dependency has an
      # install script that allowScripts in package.json neither approves nor
      # denies. Without it npm 11.19 warns and runs the script anyway, but
      # npm's docs describe blocking as the default, and a blocked Puppeteer
      # script means no Chrome for the QA scripts on a fresh install. Node
      # 24.14.0's npm 11.9.0 ignores the flag (it warns "Unknown cli config"),
      # so only the 26.x leg checks.
      - name: Install locked dependencies
        run: npm ci ${{ matrix.node == '26.x' && '--strict-allow-scripts' || '' }}

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      # Which files a fresh load fetches before the app is ready, plus exact
      # vendor bytes (scripts/load-budget-check.mjs). The file set does not
      # depend on the Node version, so one leg is enough. Chrome comes from the
      # runner image (PUPPETEER_SKIP_DOWNLOAD skips Puppeteer's own download).
      - name: Check startup weight
        if: matrix.node == '24.14.0'
        run: npm run perf:load

