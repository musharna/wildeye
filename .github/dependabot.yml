version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Template-owned (repo-template): pins are bumped there and arrive by resync.
    exclude-paths:
      - ".github/workflows/guardrails-js.yml"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

